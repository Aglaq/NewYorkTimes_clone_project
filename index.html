<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NYT Clone</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div id="searchbar">
        <div>
          <img class="icon" src="./images/magnifying-glass.svg" />
          <input type="text" placeholder="Search or start new chat..." />
        </div>
        <div>
          <ul>
            <li>U.S.</li>
            <li>INTERNATIONAL</li>
            <li>CANADA</li>
            <li>ESPAÑOL</li>
            <li>中文</li>
          </ul>
        </div>
        <div>
          <button>SUBSCRIBE FOR €0.50/WEEK</button>
          <button>LOG IN</button>
        </div>
      </div>
      <div id="logobar">
        <div>
          <p>Friday, October 23, 2026</p>
          <p>Today's Paper</p>
        </div>
        <img id="logo" src="./images/New-York-Times-logo.png" />
        <div class="market">
          <p>Nasdaq</p>
          <p>-2.6% ↓</p>
        </div>
      </div>
      <nav id="navbar">
        <ul>
          <li>U.S. ∨</li>
          <li>World ∨</li>
          <li>Business ∨</li>
          <li>Arts ∨</li>
          <li>Lifestyle ∨</li>
          <li>Opinion ∨</li>
          <li>Video ∨</li>
          <li>Shows ∨</li>
          <li>Games ∨</li>
          <li>Cooking ∨</li>
          <li>Wirecutter ∨</li>
          <li>The Athletic ∨</li>
        </ul>
      </nav>
    </header>
    <main>
      <div class="mainpart">MAIN</div>
      <div class="sidepart">SIDE</div>
    </main>
  </body>
</html>
