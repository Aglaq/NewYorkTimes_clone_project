<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NYT Clone</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header>
      <div class="searchbar">
        <div>
          <img class="icon" src="./images/magnifying-glass.svg" />
          <input type="text" placeholder="Search or start new chat..." />
        </div>
        <div>
          <ul>
            <li>U.S.</li>
            <li>INTERNATIONAL</li>
            <li>CANADA</li>
            <li>ESPAÑOL</li>
            <li>中文</li>
          </ul>
        </div>
        <div>
          <button>SUBSCRIBE FOR €0.50/WEEK</button>
          <button>LOG IN</button>
        </div>
      </div>
      <div class="logobar">LOGOBAR</div>
      <div class="navbar">NAVBAR</div>
    </header>
    <main>
      <div class="mainpart">MAIN</div>
      <div class="sidepart">SIDE</div>
    </main>
  </body>
</html>
